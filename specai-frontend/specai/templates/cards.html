<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecAI — Cards</title>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/navbar.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="stylesheet" th:href="@{/css/cards.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>

<div class="app-shell">

  <th:block th:replace="~{fragments/sidebar :: sidebar('cards')}"></th:block>

  <div class="main-wrapper">

    <th:block th:replace="~{fragments/navbar :: navbar('Cards', 'SpecAI / Requisitos')}"></th:block>

    <main class="main-content">

      <div class="page-head">
        <div>
          <h1>Requisitos</h1>
          <p>Todos os cards cadastrados, originais e refinados pela IA.</p>
        </div>
      </div>

      <div class="toolbar" role="group" aria-label="Filtrar por status">
        <button class="filter-chip is-active" data-filter="TODOS">Todos</button>
        <button class="filter-chip" data-filter="PENDENTE">Pendente</button>
        <button class="filter-chip" data-filter="PROCESSANDO">Processando</button>
        <button class="filter-chip" data-filter="REFINADO">Refinado</button>
        <button class="filter-chip" data-filter="APROVADO">Aprovado</button>
        <button class="filter-chip" data-filter="ERRO">Erro</button>
      </div>

      <div class="req-grid" id="cardsGrid">
        <!-- populado via cards.js -->
      </div>

    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>

  </div>

</div>

<th:block th:replace="~{fragments/modals :: newCardModal}"></th:block>
<th:block th:replace="~{fragments/modals :: detailsModal}"></th:block>
<th:block th:replace="~{fragments/modals :: logsModal}"></th:block>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/cards.js}"></script>
<script th:src="@{/js/cards-page.js}"></script>
</body>
</html>
