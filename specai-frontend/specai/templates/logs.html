<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecAI — Logs</title>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/navbar.css}">
  <link rel="stylesheet" th:href="@{/css/cards.css}">
  <link rel="stylesheet" th:href="@{/css/logs.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>

<div class="app-shell">

  <th:block th:replace="~{fragments/sidebar :: sidebar('logs')}"></th:block>

  <div class="main-wrapper">

    <th:block th:replace="~{fragments/navbar :: navbar('Histórico de Processamentos', 'SpecAI / Logs')}"></th:block>

    <main class="main-content">

      <div class="page-head">
        <div>
          <h1>Logs</h1>
          <p>Requisições e eventos registrados pelo motor de IA para cada card.</p>
        </div>
      </div>

      <div class="form-group" style="max-width: 360px; margin-bottom: 22px;">
        <label for="logsCardSelect">Card</label>
        <select id="logsCardSelect"></select>
      </div>

      <div class="panel data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Status</th>
              <th>Mensagem</th>
            </tr>
          </thead>
          <tbody id="logsTableBody">
            <tr><td colspan="3" style="text-align:center; color: var(--text-muted); padding: 30px;">Carregando cards...</td></tr>
          </tbody>
        </table>
      </div>

    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>

  </div>

</div>

<th:block th:replace="~{fragments/modals :: newCardModal}"></th:block>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/cards.js}"></script>
<script th:src="@{/js/logs.js}"></script>
</body>
</html>
