<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styleContato.css">
    <title>Contato</title>
</head>

<body>

    <header>
        <h1>Fale comigo</h1>
    </header>

    <aside>
        <nav>
            <ul>
                <li>
                    <a href="portfolio.html">Portfólio</a>
                </li>

                <li>
                    <a href="hobby.html">Hobby</a>
                </li>

                <li>
                    <a href="contato.html">Contato</a>
                </li>

                <li>
                    <a href="login.html">Senai</a>
                </li>

                <li>
                    <a href="paginaPessoal.html">Pagina Pessoal</a>
                </li>
            </ul>
        </nav>
    </aside>

    <main>
        <section>

            <form>
                <fieldset>
                    <legend>Antes de começar, conte-nos quem você é:</legend>

                    <label>
                        <input type="radio" name="perfil" value="recrutador" required>
                        Recrutador
                    </label>

                    <label>
                        <input type="radio" name="perfil" value="estudante">
                        Estudante
                    </label>
                </fieldset>

                <p>Insira as credenciais</p>

                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Seu@email.com" autofocus required>

                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                        placeholder="000.000.000-00" required>

                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" autocomplete="bday" min="1900-01-01"
                        required>

                    <label for="selecione">Qual é seu hobby favorito?</label>
                    <select id="selecione" name="selecione">
                        <option value="" disabled selected>Escolha uma opção</option>
                        <option value="automotivo">🏍️ Paixão pelo automotivo</option>
                        <option value="jogos">🎮 Jogos eletrônicos</option>
                        <option value="desenvolvimento">💻 Descobrindo o desenvolvimento</option>
                    </select>
                </div>

                <div>
                    <legend>Informe as tecnologias de que mais gosta:</legend>
                    <label>
                        <input type="checkbox" name="interesse[]" value="biotecnologia">
                        Biotecnologia
                    </label>

                    <label>
                        <input type="checkbox" name="interesse[]" value="tecnologia_da_informacao">
                        Tecnologia da Informação
                    </label>

                    <label>
                        <input type="checkbox" name="interesse[]" value="tecnologia_de_transporte">
                        Tecnologia de Transporte
                    </label>

                    <label>
                        <input type="checkbox" name="interesse[]" value="internet_das_coisas">
                        Internet das Coisas (IoT)
                    </label>

                    <label>
                        <input type="checkbox" name="interesse[]" value="inteligencia_artificial">
                        Inteligência Artificial (IA)
                    </label>

                    <label>
                        <input type="checkbox" name="interesse[]" value="energia_limpa">
                        Energia Limpa
                    </label>

                </div>

                <div>
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Crie uma senha">
                </div>

                <div>
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="••••••••">
                </div>

                <div>
                    <label for="seletorCor">Escolha uma cor</label>
                    <input type="color" id="seletorCor" name="seletorCor" value="#3b82f6" list="paleta-sugerida">
                    <datalist id="paleta-sugerida">
                        <option value="#ef4444"></option>
                        <option value="#22c55e"></option>
                        <option value="#3b82f6"></option>
                        <option value="#eab308"></option>
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="feedback">Feedback <span id="valorAvaliacao"> 5</span>/10</label>
                    <input type="range" id="feedback" name="feedback" min="0" max="10" value="5">

                    <label for="mensagem">Sua mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..."
                        maxlength="500" required></textarea>
                </div>

                <button class="bloqueio" type="submit" disabled>Enviar</button>

            </form>

            <div class="midias">
                <h2>Conteúdos</h2>

                <div class="videos">


                    <video controls width="600" poster="assests/imagens/images.jpg">
                        <source src="assests/mp4/Shiny_Metal_Cubes_3D.mp4" type="video/mp4">
                        <source src="https://www.youtube.com/watch?v=jk9E-HD6zbU" type="video/webm">
                    </video>
                </div>

                <div class="video-card">
                    <iframe width="560" height="315" style="pointer-events: none"
                        src="https://www.youtube.com/embed/jk9E-HD6zbU?si=UT4TUBo34HzPtCR7&autoplay=1&mute=1&loop=1&showinfo=1&controls=0"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>

                <div class="video-card">
                    <iframe width="560" height="315" style="pointer-events: none;"
                        src="https://www.youtube.com/embed/Kict_sSl82s?si=G15VVHV1TsKxUGpl&autoplay=1&mute=1&controls=0&showinfo=0&loop=1"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
            </div>


            <audio id="audioFundo" autoplay loop>
                <source src="meu-audio.mp3" type="audio/mpeg">
                <source src="meu-audio.ogg" type="audio/ogg">
            </audio>

            <iframe data-testid="embed-iframe" style="border-radius:12px"
                src="https://open.spotify.com/embed/track/2QWin1zM9hxG9zsApuIvso?utm_source=generator&si=8c73152eed934eaa"
                width="100%" height="352" frameBorder="0" allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>





        </section>
    </main>

    <script src="js/scriptContato.js"></script>
</body>

</html>
