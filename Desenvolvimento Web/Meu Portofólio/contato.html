<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>

<body>
    <aside>
        <nav>
            <ul>
                <li>
                    <a href="portfolio.html">Portfólio</a>
                </li>

                <li>
                    <a href="hobby.html">Hobby</a>
                </li>

                <li>
                    <a href="contato.html">Contato</a>
                </li>
            </ul>
        </nav>
    </aside>

    <main>
        <section>

            <h1>Fale comigo</h1>
            <p>Insirá as credênciais</p>

            <fieldset>
                <legend>Antes de começar, conte-mos quem você é:</legend>

                <label>
                    <input type="radio" name="perfil" value="recrutador" required>
                    Recrutador
                </label>

                <label>
                    <input type="radio" name="perfil" value="estudante">
                    Estudante
                </label>
            </fieldset>

            <Form>
                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Seu@email.com" autofocus required>
                </div>

                <div>
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                        placeholder="000.000.000-00">
                </div>


                <label for="selecione">Qual é seu Hobby favorito?</label>
                <select id="selecione" name="selecione">
                    <option value="" disabled selected>Escolha uma opção</option>
                    <option value="automotivo">🏍️ Paixão pelo Automotivo</option>
                    <option value="jogos">🎮 Jogos eletrônicos</option>
                    <option value="desenvolvimento">💻 Descobrindo o Desenvolvimento</option>
                </select>

                <div>
                    <legend>Informe as técnologias que mais gosta:</legend>
                    <div>
                        <label>
                            <input type="checkbox" name="interesse[]" value="biotecnologia">
                            Biotecnologia
                        </label>
                    </div>
                    <div>
                        <label">
                            <input type="checkbox" name="interesse[]" value="tecnologia_da_informacao">
                            Técnologia da Informação
                            </labe>
                    </div>
                    <label>
                        <input type="checkbox" name="interesse[]" value="tecnologia_de_transporte">
                        Técnologia de Transporte
                    </label>
                    <div>
                        <label>
                            <input type="checkbox" name="interesse[]" value="internet_das_coisas">
                            Internet das Coisas(IoT)
                        </label>
                    </div>
                    <div>
                        <label>
                            <input type="checkbox" name="interesse[]" value="inteligencia_artificial">
                            Inteligência Artificial(IA)
                        </label>
                        <div>
                            <label>
                                <input type="checkbox" name="interesse[]" value="energia_limpa">
                                Energia Limpa
                            </label>
                        </div>
                    </div>
                    <div>
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="Crie uma senha">
                    </div>

                    <div>
                        <label for="confirmarSenha">Confirmar Senha</label>
                        <input type="text" id="confirmarSenha" name="confirmarSenha" placeholder="••••••••">
                    </div>

                    <label for="feedback">Feedback <span id="valorAvaliacao"> 5</span>/10</label>
                    <input type="range" id="feedback" name="feedback" min="0" max="10" step="0.5" value="5">
            </Form>
        </section>
    </main>

    <script src="js/feedbackContato.js"> </script>
</body>

</html>
