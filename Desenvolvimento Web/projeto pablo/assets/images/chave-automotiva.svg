    <circle cx="312" cy="196" r="30" fill="url(#hinge)"/>
    <circle cx="312" cy="196" r="18" fill="none" stroke="#fff" stroke-opacity=".5"/>
    <circle cx="312" cy="196" r="7" fill="#1e2a4a"/>

    <g clip-path="url(#bodyClip)"><rect x="120" y="112" width="90" height="168" fill="url(#sheen)" opacity=".35" transform="skewX(-18)"/></g>
