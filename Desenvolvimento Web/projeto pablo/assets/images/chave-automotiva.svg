      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bodyClip"><path d="M122 120 h144 c22 0 38 18 38 40 v72 c0 22 -16 40 -38 40 h-144 c-35 0 -62 -30 -62 -76 s27 -76 62 -76 Z"/></clipPath>
    <mask id="reflect"><rect x="0" y="250" width="640" height="150" fill="url(#fade)"/></mask>
  </defs>

  <ellipse cx="300" cy="196" rx="270" ry="120" fill="url(#glow)"/>

  <g id="key">
