<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ilustração de chave automotiva canivete codificada</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4766"/>
      <stop offset=".18" stop-color="#1b2645"/>
      <stop offset=".6" stop-color="#0b1430"/>
      <stop offset="1" stop-color="#050b1d"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset=".25" stop-color="#9fb0d4"/>
      <stop offset=".5" stop-color="#e7edfb"/>
      <stop offset=".72" stop-color="#5d6d93"/>
      <stop offset="1" stop-color="#c9d4ee"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".2" stop-color="#cfd9ef"/>
      <stop offset=".48" stop-color="#7e8fb5"/>
      <stop offset=".55" stop-color="#e9eefb"/>
      <stop offset="1" stop-color="#8091b8"/>
    </linearGradient>
    <radialGradient id="hinge" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#b9c6e4"/>
      <stop offset=".75" stop-color="#4d5d84"/>
      <stop offset="1" stop-color="#1e2a4a"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
