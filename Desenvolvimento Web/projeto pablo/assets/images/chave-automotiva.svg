    <path d="M318 172 H560 a8 8 0 0 1 6 3 l22 21 l-22 21 a8 8 0 0 1 -6 3 H318 Z" fill="url(#blade)"/>
    <path d="M332 190 C356 182 368 202 392 194 S428 182 452 192 S488 204 512 194 S548 184 570 196" fill="none" stroke="#56678f" stroke-width="5" stroke-linecap="round"/>
    <path d="M332 190 C356 182 368 202 392 194 S428 182 452 192 S488 204 512 194 S548 184 570 196" fill="none" stroke="#eaf0ff" stroke-width="1.2" stroke-linecap="round" transform="translate(0 -3)" opacity=".8"/>
    <rect x="318" y="173" width="250" height="5" fill="#fff" opacity=".55"/>

    <!-- corpo / telecomando -->
    <path d="M118 112 h150 c26 0 44 22 44 48 v72 c0 26 -18 48 -44 48 h-150 c-40 0 -70 -34 -70 -84 s30 -84 70 -84 Z" fill="url(#bezel)"/>
    <path d="M122 120 h144 c22 0 38 18 38 40 v72 c0 22 -16 40 -38 40 h-144 c-35 0 -62 -30 -62 -76 s27 -76 62 -76 Z" fill="url(#body)"/>
    <path d="M128 126 h132 c18 0 30 12 32 26 h-200 c8 -16 20 -26 36 -26 Z" fill="#fff" opacity=".08"/>

    <!-- botões -->
    <g fill="#16213f" stroke="#5f73a6" stroke-width="1.5">
      <rect x="104" y="152" width="58" height="40" rx="12"/>
      <rect x="176" y="152" width="58" height="40" rx="12"/>
      <rect x="140" y="204" width="58" height="40" rx="12"/>
    </g>
    <g fill="none" stroke="#c9d6f5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="125" y="171" width="16" height="12" rx="2"/>
      <path d="M128 171 v-4 a5 5 0 0 1 10 0 v4"/>
      <rect x="197" y="171" width="16" height="12" rx="2"/>
      <path d="M200 171 v-4 a5 5 0 0 1 10 0"/>
