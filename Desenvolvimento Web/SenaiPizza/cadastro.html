<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section>
        <h1>Cadastro</h1>
        <p>Preencha os campos a baixo</p>

        <div>
            <label for="name">Nome Completo</label>
            <input type="text" id="name" name="name" placeholder="Informe seu nome" required>
        </div>

        <div>
             <label for="cpf">CPF</label>
             <input type="text" id="cpf" name="cpf" placeholder="00.000.000-00" required>
        </div>

        <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Informe Senha" required>
        </div>

        <div>
            <label for="confirmarSenha">Confirmar Senha</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" required>
        </div>

        <button type="submit">Cadastrar</button>
    
        <p>
            Já possue uma conta <a href="login.html">Faça Login</a>
        </p>
    </section>
    
</body>
</html>
