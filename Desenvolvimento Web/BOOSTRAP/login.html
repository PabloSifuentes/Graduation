<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Senai Pizzas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/navbar.css">
    <link rel="stylesheet" href="static/css/login.css">
</head>

<body class="auth-page">

    <svg width="0" height="0" class="position-absolute" aria-hidden="true">
        <symbol id="fatia" viewBox="0 0 120 150">
            <path d="M60 146 L6 22 Q60 -2 114 22 Z" fill="#ffc107" stroke="#e0a100" stroke-width="3"
                stroke-linejoin="round" />
            <path d="M6 22 Q60 -2 114 22 L108 36 Q60 14 12 36 Z" fill="#c8791f" />
            <circle cx="45" cy="58" r="9" fill="#dc3545" />
            <circle cx="76" cy="64" r="9" fill="#dc3545" />
            <circle cx="60" cy="100" r="8" fill="#dc3545" />
            <circle cx="60" cy="79" r="3" fill="#2d6a4f" />
            <circle cx="36" cy="44" r="2.5" fill="#2d6a4f" />
            <circle cx="86" cy="45" r="2.5" fill="#2d6a4f" />
        </symbol>
    </svg>

    <header>
        <div id="navbar"></div>
    </header>

    <main class="auth-main container d-flex justify-content-center align-items-center py-5">
        <div class="auth-container position-relative overflow-hidden rounded-4 mw-100" id="container">

            <div class="form-box sign-up-box">
                <form id="cadastroForm"
                    class="d-flex flex-column align-items-center justify-content-center h-100 px-4 px-lg-5 text-center">
                    <svg class="mini-fatia" aria-hidden="true">
                        <use href="#fatia" />
                    </svg>
                    <h1 class="h3 fw-bold text-dark my-2">Criar conta</h1>

                    <div class="d-flex gap-2 my-2">
                        <a href="#" class="btn btn-outline-secondary rounded-circle social-btn"
                            aria-label="Cadastrar com Facebook"><ion-icon name="logo-facebook"></ion-icon></a>
                        <a href="#" class="btn btn-outline-secondary rounded-circle social-btn"
                            aria-label="Cadastrar com Google"><ion-icon name="logo-google"></ion-icon></a>
                        <a href="#" class="btn btn-outline-secondary rounded-circle social-btn"
                            aria-label="Cadastrar com LinkedIn"><ion-icon name="logo-linkedin"></ion-icon></a>
                    </div>
                    <p class="small text-secondary mb-2">ou use seu e-mail para se cadastrar</p>

                    <div class="form-floating w-100 mb-2">
                        <input type="text" class="form-control" id="cadNome" placeholder="Nome" autocomplete="name"
                            required>
                        <label for="cadNome">Nome</label>
                    </div>
                    <div class="form-floating w-100 mb-2">
                        <input type="email" class="form-control" id="cadEmail" placeholder="E-mail" autocomplete="email"
                            required>
                        <label for="cadEmail">E-mail</label>
                    </div>
                    <div class="form-floating w-100 mb-2">
                        <input type="password" class="form-control" id="cadSenha" placeholder="Senha"
                            autocomplete="new-password" required>
                        <label for="cadSenha">Senha</label>
                    </div>

                    <button type="submit" class="btn btn-danger rounded-pill px-5 fw-bold mt-2">Cadastrar</button>
                    <button type="button" class="btn btn-link btn-sm text-secondary d-md-none mt-2"
                        data-alternar="login">Já tem conta? Entrar</button>
                </form>
            </div>

            <div class="form-box sign-in-box">
                <form id="loginForm"
                    class="d-flex flex-column align-items-center justify-content-center h-100 px-4 px-lg-5 text-center">
                    <svg class="mini-fatia" aria-hidden="true">
                        <use href="#fatia" />
                    </svg>
                    <h1 class="h3 fw-bold text-dark my-2">Entrar</h1>

                    <div class="d-flex gap-2 my-2">
                        <a href="#" class="btn btn-outline-secondary rounded-circle social-btn"
                            aria-label="Entrar com Facebook"><ion-icon name="logo-facebook"></ion-icon></a>
                        <a href="#" class="btn btn-outline-secondary rounded-circle social-btn"
                            aria-label="Entrar com Google"><ion-icon name="logo-google"></ion-icon></a>
                        <a href="#" class="btn btn-outline-secondary rounded-circle social-btn"
                            aria-label="Entrar com LinkedIn"><ion-icon name="logo-linkedin"></ion-icon></a>
                    </div>
                    <p class="small text-secondary mb-2">ou use sua conta</p>

                    <div class="form-floating w-100 mb-2">
                        <input type="email" class="form-control" id="loginEmail" placeholder="E-mail"
                            autocomplete="email" required>
                        <label for="loginEmail">E-mail</label>
                    </div>
                    <div class="form-floating w-100 mb-2">
                        <input type="password" class="form-control" id="loginSenha" placeholder="Senha"
                            autocomplete="current-password" required>
                        <label for="loginSenha">Senha</label>
                    </div>

                    <a href="#" class="small text-secondary mt-1">Esqueceu sua senha?</a>
                    <button type="submit" class="btn btn-danger rounded-pill px-5 fw-bold mt-3">Entrar</button>
                    <button type="button" class="btn btn-link btn-sm text-secondary d-md-none mt-2"
                        data-alternar="cadastro">Não tem conta? Cadastre-se</button>
                </form>
            </div>

            <div class="overlay-container d-none d-md-block">
                <div class="overlay">
                    <div
                        class="overlay-panel overlay-left d-flex flex-column align-items-center justify-content-center text-center px-4">
                        <svg class="slice" style="--giro:-14deg" aria-hidden="true">
                            <use href="#fatia" />
                        </svg>
                        <h2 class="h4 fw-bold mt-3">Que bom te ver de novo!</h2>
                        <p class="small mb-3">Entre com sua conta e faça seu pedido em poucos cliques.</p>
                        <button type="button" class="btn btn-outline-light rounded-pill px-5 fw-bold"
                            id="signIn">Entrar</button>
                    </div>
                    <div
                        class="overlay-panel overlay-right d-flex flex-column align-items-center justify-content-center text-center px-4">
                        <svg class="slice" style="--giro:14deg" aria-hidden="true">
                            <use href="#fatia" />
                        </svg>
                        <h2 class="h4 fw-bold mt-3">Primeira vez por aqui?</h2>
                        <p class="small mb-3">Crie sua conta e peça a pizza feita por estudantes do SENAI.</p>
                        <button type="button" class="btn btn-outline-light rounded-pill px-5 fw-bold"
                            id="signUp">Cadastrar</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script src="static/js/navbar.js"></script>
    <script src="static/js/login.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
