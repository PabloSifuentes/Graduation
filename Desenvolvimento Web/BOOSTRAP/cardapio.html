<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/cardapio.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/navbar.css">
    <title></title>
</head>

<body>

    <header>
        <div id="navbar"></div>
    </header>

    <main class="container my-5">
        <h2 class="text-center mb-4">cardápio</h2>

        <div class="row g-4">

            <section class="col-12 col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-warning fw-bold">Sabores</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">Calabresa</li>
                        <li class="list-group-item">Frango</li>
                        <li class="list-group-item">POrtuguesa</li>
                        <li class="list-group-item">Quatro Queijos</li>
                        <li class="list-group-item">Vegetariana</li>
                    </ul>
                </div>
            </section>

            <section class="col-12 col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-warning fw-bold">Tamanhos</div>
                    <div class="table-responsive">
                        <table class="table table-striped mb-0">
                            <thead>
                                <tr>
                                    <th>Tamanho</th>
                                    <th>Pedaços</th>
                                    <th>Preços</th>
                                </tr>
                            </thead>
                            <tbody class="tr-center">
                                <tr>
                                    <td>Pequena (P)</td>
                                    <td>4</td>
                                    <td>R$ 20,00</td>
                                </tr>
                                <tr>
                                    <td>Média (M)</td>
                                    <td>8</td>
                                    <td>R$ 30,00</td>
                                </tr>
                                <tr>
                                    <td>Grande (G)</td>
                                    <td>12</td>
                                    <td>R$ 40,00</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script src="static/js/navbar.js"></script>
</body>

</html>
