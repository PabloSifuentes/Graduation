<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa das Chaves - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section>
            <h1>Cadastrar</h1>
            <p>Crie sua conta agora!</p>

            <form action="#" method="post" id="form-cadastro">

                <fieldset>
                    <legend>Tipo de Cadastro</legend>
                    <label>
                        <input type="radio" name="tipo_pessoa" value="pf" checked>
                        Pessoa Física (CPF)
                    </label>
                    <label>
                        <input type="radio" name="tipo_pessoa" value="pj">
                        Empresa (CNPJ)
                    </label>
                </fieldset>
                
                <div id="campos-pf">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf">
                </div>
                
                <div id="campos-pj" hidden>
                    <label for="cnpj">CNPJ</label>
                    <input type="text" id="cnpj" name="cnpj">
                </div>
                
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
                
                <button type="submit">Cadastrar</button>
                <p class="link">
                    Já tem conta? <a href="login.html">Fazer Login</a>
                </p>
            </form>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
