<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa das Chaves - Cadastro</title>
    <link rel="stylesheet" href="css/styleCadastro.css">
</head>
<body>
    <main class="cadastro-container">
        <section class="cadastro-card">
            <div class="logo-container">
                <img src="assets/imagens/casaDasChaves.png" alt="Logo Casa das Chaves" class="logo-img">
                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
            </div>

            <h1>Cadastrar</h1>
            <p class="subtitulo">Crie sua conta agora!</p>

            <div class="seletor-wrapper">
                <div class="seletor-bg" id="seletorBg"></div>
                <button type="button" class="seletor-btn ativo" data-tipo="pf" id="btnPf">Pessoa Física</button>
                <button type="button" class="seletor-btn" data-tipo="pj" id="btnPj">Empresa</button>
            </div>

            <form action="#" method="post" id="form-cadastro">

                <div id="grupoPf" class="grupo-campos ativos">
                    <div class="campo">
                        <label for="nomeCompleto">Nome Completo</label>
                        <div class="input-group">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="nomeCompleto" name="nomeCompleto" placeholder="Insirá seu nome">
                        </div>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <div class="input-group">
                            <i class="fas fa-id-card input-icon"></i>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                        </div>
                    </div>

                    <div class="campo">
                        <label for="telefonePf">Telefone</label>
                        <div class="input-group">
                            <i class="fas fa-phone input-icon"></i>
                            <input type="tel" id="telefonePf" name="telefonePf" placeholder="(00) 00000-0000">
                        </div>
                    </div>

                    <div class="campo">
                        <label for="emailPf">E-mail</label>
                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="emailPf" name="emailPf" placeholder="seu@email.com">
                        </div>
                    </div>

                    <div class="campo">
                        <label for="password">Senha</label>
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" placeholder="••••••••">
                            <button type="button" class="password-toggle" data-target="password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="password">Confirmar Senha</label>
                        <div class="input-group">
                           <i class="fas fa-lock input-icon"></i>
                           <input type="password" id="password" name="password" placeholder="••••••••">
                            <button type="button" class="password-toggle" data-target="password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="grupoPj" class="grupo-campos">
                    <!-- Razão Social -->
                    <div class="campo">
                        <label for="razaoSocial">Razão Social</label>
                        <div class="input-group">
                            <i class="fas fa-building input-icon"></i>
                            <input type="text" id="razaoSocial" name="razaoSocial" placeholder="Empresa XYZ Ltda">
                        </div>
                    </div>

                    <!-- Nome Fantasia -->
                    <div class="campo">
                        <label for="nomeFantasia">Nome Fantasia</label>
                        <div class="input-group">
                            <i class="fas fa-store input-icon"></i>
                            <input type="text" id="nomeFantasia" name="nomeFantasia" placeholder="XYZ Store">
                        </div>
                    </div>

                    <!-- CNPJ -->
                    <div class="campo">
                        <label for="cnpj">CNPJ</label>
                        <div class="input-group">
                            <i class="fas fa-building-columns input-icon"></i>
                            <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00">
                        </div>
                    </div>

                    <!-- Telefone -->
                    <div class="campo">
                        <label for="telefonePj">Telefone</label>
                        <div class="input-group">
                            <i class="fas fa-phone input-icon"></i>
                            <input type="tel" id="telefonePj" name="telefonePj" placeholder="(00) 00000-0000">
                        </div>
                    </div>

                    <!-- E-mail -->
                    <div class="campo">
                        <label for="emailPj">E-mail</label>
                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="emailPj" name="emailPj" placeholder="contato@empresa.com">
                        </div>
                    </div>

                    <!-- Senha -->
                    <div class="campo">
                        <label for="senhaPj">Senha</label>
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="senhaPj" name="senhaPj" placeholder="••••••••">
                            <button type="button" class="password-toggle" data-target="senhaPj">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Confirmar Senha -->
                    <div class="campo">
                        <label for="confirmarSenhaPj">Confirmar Senha</label>
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="confirmarSenhaPj" name="confirmarSenhaPj" placeholder="••••••••">
                            <button type="button" class="password-toggle" data-target="confirmarSenhaPj">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
            
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
                <p class="link">
                    Já tem conta? <a href="login.html">Fazer Login</a>
                </p>
            </form>
        </section>
    </main>

    <script src="js/scriptCadastro.js"></script>
</body>
</html>
